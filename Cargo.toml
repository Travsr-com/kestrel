[workspace]
resolver = "3"
members = [
    "crates/kestrel-types",
    "crates/kestrel-store",
    "crates/kestrel-core",
    "crates/kestrel-sandbox",
    "crates/kestrel-gateway",
    "crates/kestrel-agent",
    "crates/kestrel-server",
    "crates/kestrel-cli",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Travsr Contributors"]
repository = "https://github.com/Travsr-com/kestrel"
rust-version = "1.89"

[workspace.dependencies]
kestrel-types   = { path = "crates/kestrel-types" }
kestrel-store   = { path = "crates/kestrel-store" }
kestrel-core    = { path = "crates/kestrel-core" }
kestrel-sandbox = { path = "crates/kestrel-sandbox" }
kestrel-gateway = { path = "crates/kestrel-gateway" }
kestrel-agent   = { path = "crates/kestrel-agent" }
kestrel-server  = { path = "crates/kestrel-server" }

# Shared third-party versions. Add new ones here, not in crate manifests.
tokio        = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util   = "0.7"
futures      = "0.3"
async-trait  = "0.1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
thiserror    = "2"
anyhow       = "1"
uuid         = { version = "1", features = ["v7", "serde"] }
getrandom    = "0.4"
time         = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
rusqlite     = { version = "0.41", features = ["bundled"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap         = { version = "4", features = ["derive"] }
axum         = "0.8"
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes        = "1"
url          = "2"
tempfile     = "3"
proptest     = "1"
wiremock     = "0.6"
tower        = { version = "0.5", features = ["util"] }
# The embedded UI (#37). With `allow_missing`, a build without ui/dist still compiles.
rust-embed   = { version = "8", features = ["mime-guess"] }
# Test client for the event sockets. The same version axum's `ws` feature uses.
tokio-tungstenite = "0.29"
assert_cmd   = "2"
predicates   = "3"
toml         = "0.8"
# Capability tokens (#33). Pinned exactly: 6.0.0 fails `cargo deny` (RUSTSEC-2026-0387 via
# crypto-bigint 0.5.5), and 7.0.0 is still a pre-release, so no other version may slip in.
# No default features: Kestrel uses no Datalog macros, PEM keys or Unicode regex classes.
biscuit-auth = { version = "=7.0.0-alpha.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
