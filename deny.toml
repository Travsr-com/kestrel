# cargo-deny: blocks known-vulnerable crates and licenses that are not
# compatible with Apache-2.0. Adapted from Travsr-com/travsr.

[advisories]
version = 2
# Add an exception only with a `reason` explaining why it has no runtime exposure.
ignore = []

[licenses]
# Anything not listed is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
